name: render-package-status-report

concurrency:
  group: gh-pages-${{ github.repository }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      target:
        description: Which report to rebuild
        required: true
        default: main
        type: choice
        options:
          - main
          - dev

jobs:
  build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - branch: main
            deploy-target: ""
            output-subdir: ""
            deploy-clean: true
            deploy-clean-exclude: |
              dev
              pr
          - branch: dev
            deploy-target: dev
            output-subdir: dev
            deploy-clean: false
            deploy-clean-exclude: ""

    if: >-
      (github.event_name == 'push' && github.ref == format('refs/heads/{0}', matrix.branch))
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.target == matrix.branch)

    uses: ./.github/workflows/render-report-reusable.yaml
    secrets: inherit
    with:
      ref: ${{ github.event_name == 'push' && github.ref || matrix.branch }}
      title: "Tidyverse"
      pkg-list-path: "inst/extdata/package-list.csv"
      output-subdir: ${{ matrix.output-subdir }}
      deploy: true
      deploy-target: ${{ matrix.deploy-target }}
      deploy-clean: ${{ matrix.deploy-clean }}
      deploy-clean-exclude: ${{ matrix.deploy-clean-exclude }}


  build-pr:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/render-report-reusable.yaml
    secrets: inherit
    with:
      ref: ${{ github.sha }}
      title: "Tidyverse"
      pkg-list-path: "inst/extdata/package-list.csv"
      output-subdir: pr/${{ github.event.pull_request.number }}
      deploy: true
      deploy-target: pr/${{ github.event.pull_request.number }}
      deploy-clean: false
      pr-number: ${{ github.event.pull_request.number }}